version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: athina_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-athina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athina_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-athina}
    volumes:
      - athina_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-athina}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: athina_backend
    restart: always
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-athina}:${POSTGRES_PASSWORD:-athina_secure_password}@db:5432/${POSTGRES_DB:-athina}
    volumes:
      - ./backend/static/images:/app/backend/static/images
      - ./backend/data:/app/backend/data
      - ./imagegen/curated:/app/imagegen/curated
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: athina_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  athina_postgres_data:
  caddy_data:
  caddy_config:
